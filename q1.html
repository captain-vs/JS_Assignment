<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Click: <span id="counter">0</span></p>
    <button onclick="inc()" id="myButton">Click Me</button>
    <button onclick="clearData()" id="clearButton">Reset</button>

    <script>
      const counterDisplay = document.getElementById("counter");
      let count = 0;

      function inc() {
        count++;
        counterDisplay.innerText = count;
      }

      function clearData() {
        count = 0;
        counterDisplay.innerText = count;
      }
    </script>
  </body>
</html>
